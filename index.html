<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<!-- Prevent Search Engine Indexing -->
	<meta name="robots" content="noindex" />
	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-172825265-1"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() {
			dataLayer.push(arguments);
		}
		gtag("js", new Date());
		gtag("config", "UA-172825265-1");
	</script>
	<!-- Favicon -->
	<link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico" />
	<!-- Flip Board CSS -->
	<link rel="stylesheet" href="css/flipboard.css" />
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,800&display=swap" rel="stylesheet" />
	<title>Isaac Bock</title>
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		html {
			line-height: 1.5;
			-webkit-text-size-adjust: 100%;
			text-size-adjust: 100%;
		}

		body {
			margin: 0;
			font-family: 'Montserrat', sans-serif;
			font-weight: 400;
			color: #1f2937;
			background: linear-gradient(180deg, #fbfbfb 0%, white 50%);
			overflow-x: hidden;
		}

		#intro_video {
			display: block;
			width: 100%;
			height: 100vh;
			height: 100svh;
			object-fit: cover;
		}

		/* Plain 100vh (~large viewport on phones): a 100svh section would
		   clamp-jump the scroll position when the URL bar collapses */
		#main_content {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1rem;
			background: linear-gradient(180deg, #fbfbfb 0%, white 50%);
		}

		#main_content>div {
			width: 100%;
			max-width: 72rem;
			text-align: center;
		}
	</style>
</head>

<body>
	<!-- Lettering Video -->
	<video autoplay muted playsinline id="intro_video">
		<source src="assets/LetteredIntro.mp4" type="video/mp4" />
		Your browser does not support videos.
	</video>

	<div id="main_content">
		<div>
			<!-- Flip Board Component -->
			<div id="flipBoard" class="flip-board" role="img" aria-label="Split-flap travel board">
				<div id="flipDisplay"></div>
			</div>
		</div>
	</div>

	<!-- JS -->
	<script src="js/app.js"></script>
</body>

</html>
